<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Análisis de Plazos — Monday.com</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0f1625;
      --surface: #1a1f35;
      --card: #232d47;
      --panel: #1e2638;
      --border: #404c63;
      --border2: #505d7a;
      --text: #e8ebf0;
      --text2: #b8c2d4;
      --text3: #8a96ab;
      --accent: #5b8ff9;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'Space Mono', monospace; min-height: 100vh; }
    .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0.65rem 1.5rem; display: flex; align-items: center; gap: 1rem; }
    .topbar h1 { font-size: 1rem; flex: 1; }
    .filterbar { background: var(--panel); border-bottom: 1px solid var(--border); padding: 0.8rem 1.5rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .filterbar label { font-size: 0.75rem; color: var(--text3); }
    .filterbar input, .filterbar select { background: var(--card); border: 1px solid var(--border2); color: var(--text); padding: 0.4rem 0.6rem; border-radius: 4px; font-family: monospace; font-size: 0.75rem; }
    .filterbar button { background: none; border: 1px solid var(--border2); color: var(--text2); padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
    #fcount { margin-left: auto; color: var(--accent); font-weight: bold; }
    .tabs { display: flex; gap: 0.3rem; flex-wrap: wrap; padding: 0.8rem 1.5rem; border-bottom: 1px solid var(--border); background: var(--surface); }
    .tab { background: none; border: 1px solid transparent; color: var(--text3); padding: 0.3rem 0.75rem; border-radius: 4px; cursor: pointer; font-size: 0.7rem; }
    .tab.active { background: var(--accent); color: white; border-color: var(--accent); }
    #sections { padding: 1.5rem; }
    .section { display: none; }
    .section.active { display: block; }
    table { width: 100%; border-collapse: collapse; margin: 1rem 0; font-size: 0.75rem; }
    table th { background: var(--panel); padding: 0.6rem; text-align: left; border-bottom: 1px solid var(--border); font-weight: bold; }
    table td { padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--border); }
    h3 { margin: 1.2rem 0 0.4rem; font-size: 0.95rem; color: var(--accent); }
    p { color: var(--text2); margin: 0.5rem 0; font-size: 0.8rem; }
  </style>
</head>
<body>

<div class="topbar">
  <h1>📊 Análisis de Plazos — <span style="color: var(--accent);">Nueva Estructura</span></h1>
</div>

<div class="filterbar">
  <label>Proyecto:</label>
  <input type="text" id="filterProyecto" placeholder="Buscar..." onkeyup="applyFilters()"/>
  
  <label>Etapa:</label>
  <select id="filterEtapa" onchange="applyFilters()">
    <option value="">Todas</option>
  </select>
  
  <button onclick="resetFilters()">↻ Limpiar</button>
  <span id="fcount">0 / 0</span>
</div>

<div class="tabs" id="tabs"></div>
<div id="sections"></div>

<script>
// GLOBAL STATE
let DF = [];

// SECCIONES (Pestañas)
const SECS = [
  {id: 'seq', label: '📈 Análisis Secuencia', fn: (df) => buildSecuencia(df)},
  {id: 'stage-dur', label: '⏸ Etapas & Duraciones', fn: (df) => buildStageDurations(df)},
  {id: 'overlap', label: '🔀 Solapamientos', fn: (df) => buildSolapamientos(df)},
  {id: 'dur', label: '⏱ Duración Tareas', fn: (df) => buildDuracion(df)},
  {id: 'det', label: '📋 Detalle', fn: (df) => buildDetalle(df)},
];

// FILTROS
function applyFilters(){
  const proyecto = document.getElementById('filterProyecto').value.toLowerCase().trim();
  const etapa = document.getElementById('filterEtapa').value;
  
  let filtered = DF;
  
  if(proyecto) filtered = filtered.filter(r => (r.Proyecto || '').toLowerCase().includes(proyecto));
  if(etapa) filtered = filtered.filter(r => (r.Etapa || 'Sin Etapa') === etapa);
  
  document.getElementById('fcount').textContent = `${filtered.length} / ${DF.length}`;
  
  // Renderizar pestaña activa con datos filtrados
  const activeTab = document.querySelector('.section.active');
  if(activeTab){
    const id = activeTab.id.replace('sec-', '');
    const sec = SECS.find(s => s.id === id);
    if(sec) activeTab.innerHTML = sec.fn(filtered);
  }
}

function resetFilters(){
  document.getElementById('filterProyecto').value = '';
  document.getElementById('filterEtapa').value = '';
  applyFilters();
}

// ENRIQUECIMIENTO
function enrichPlazos(df){
  return df.map(r => {
    const raw = r['Planificado'] || r['Proyectado'] || '';
    const m = String(raw).match(/(\\d{4}-\\d{2}-\\d{2}).*?(\\d{4}-\\d{2}-\\d{2})/);
    const ini = m ? new Date(m[1]) : null;
    const fin = m ? new Date(m[2]) : null;
    const durPlan = ini && fin ? Math.round((fin - ini) / 86400000) : null;
    
    const vStd = r['Plazo Estándard'] || r['Plazo (días)'] || '';
    const nStd = parseFloat(String(vStd).replace(/[^0-9.]/g, '')) || null;
    
    return {...r, _ini: ini, _fin: fin, _durPlan: durPlan, _stdDias: nStd};
  });
}

// ANÁLISIS 1: SECUENCIA
function buildSecuencia(df){
  const ep = enrichPlazos(df);
  const etM = {};
  ep.forEach(r => {
    const e = r.Etapa || 'Sin Etapa';
    if(!etM[e]) etM[e] = [];
    etM[e].push(r);
  });
  
  let html = '<h3>📈 Tareas por Etapa</h3>';
  
  Object.entries(etM).forEach(([etapa, items]) => {
    const conDur = items.filter(r => r._stdDias);
    const total = conDur.reduce((s, r) => s + r._stdDias, 0);
    
    html += `<div style="margin: 1rem 0; padding: 0.8rem; background: var(--panel); border-left: 3px solid var(--accent);">
      <strong>${etapa}</strong> (${conDur.length} tareas, ${total}d total)
      <table>
        <tr style="background: var(--surface);">
          <th>Tarea</th><th>Días</th><th>Inicio</th>
        </tr>`;
    
    conDur.slice(0, 15).forEach(r => {
      const inicio = r._ini ? r._ini.toLocaleDateString('es-CL') : '—';
      html += `<tr><td>${r.Ítem || '—'}</td><td>${r._stdDias}d</td><td>${inicio}</td></tr>`;
    });
    
    html += '</table></div>';
  });
  
  return html;
}

// ANÁLISIS 2: DURACIONES POR ETAPA
function buildStageDurations(df){
  const ep = enrichPlazos(df);
  const etM = {};
  
  ep.forEach(r => {
    const e = r.Etapa || 'Sin Etapa';
    if(!etM[e]) etM[e] = {items: 0, sum: 0, min: null, max: null};
    etM[e].items++;
    if(r._stdDias) etM[e].sum += r._stdDias;
    if(r._ini) etM[e].min = !etM[e].min || r._ini < etM[e].min ? r._ini : etM[e].min;
    if(r._fin) etM[e].max = !etM[e].max || r._fin > etM[e].max ? r._fin : etM[e].max;
  });
  
  let html = '<h3>⏸ Duración Total por Etapa</h3><table><tr style="background: var(--panel);"><th>Etapa</th><th>Tareas</th><th>Suma Días</th><th>Span Real</th><th>% Paralelo</th></tr>';
  
  Object.entries(etM).forEach(([e, v]) => {
    const span = v.min && v.max ? Math.round((v.max - v.min) / 86400000) : 0;
    const para = v.sum > 0 && span > 0 ? Math.round((1 - span / v.sum) * 100) : 0;
    
    html += `<tr><td>${e}</td><td>${v.items}</td><td>${v.sum}d</td><td>${span}d</td><td>${para}%</td></tr>`;
  });
  
  html += '</table>';
  return html;
}

// ANÁLISIS 3: SOLAPAMIENTOS
function buildSolapamientos(df){
  const ep = enrichPlazos(df);
  const etM = {};
  
  ep.forEach(r => {
    const e = r.Etapa || 'Sin Etapa';
    if(!etM[e]) etM[e] = {};
    const fk = r._ini ? r._ini.toLocaleDateString('es-CL') : 'Sin Fecha';
    if(!etM[e][fk]) etM[e][fk] = [];
    etM[e][fk].push(r);
  });
  
  let html = '<h3>🔀 Tareas Paralelas por Etapa</h3>';
  
  Object.entries(etM).forEach(([etapa, fechas]) => {
    const paralelas = Object.values(fechas).filter(arr => arr.length > 1);
    if(paralelas.length === 0) return;
    
    html += `<div style="margin: 1rem 0; padding: 0.8rem; background: var(--panel); border-left: 3px solid var(--accent);">
      <strong>${etapa}</strong> (${paralelas.length} grupo(s))<table>
      <tr style="background: var(--surface);"><th>Fecha</th><th>N°</th><th>Tareas</th></tr>`;
    
    Object.entries(fechas).forEach(([fecha, tareas]) => {
      if(tareas.length > 1){
        const nombres = tareas.map(t => t.Ítem || '—').join(', ').substring(0, 50);
        html += `<tr><td>${fecha}</td><td>${tareas.length}</td><td>${nombres}</td></tr>`;
      }
    });
    
    html += '</table></div>';
  });
  
  if(!html.includes('<table>')) html += '<p>ℹ️ Sin tareas paralelas detectadas</p>';
  return html;
}

// ANÁLISIS 4: DURACIÓN
function buildDuracion(df){
  const ep = enrichPlazos(df);
  const etM = {};
  
  ep.forEach(r => {
    const e = r.Etapa || 'Sin Etapa';
    if(!etM[e]) etM[e] = {cnt: 0, stdSum: 0, stdCnt: 0, planSum: 0, planCnt: 0};
    etM[e].cnt++;
    if(r._stdDias) { etM[e].stdSum += r._stdDias; etM[e].stdCnt++; }
    if(r._durPlan) { etM[e].planSum += r._durPlan; etM[e].planCnt++; }
  });
  
  let html = '<h3>⏱ Duración Promedio por Etapa</h3><table><tr style="background: var(--panel);"><th>Etapa</th><th>Tareas</th><th>Prom Estándar</th><th>Prom Planificado</th></tr>';
  
  Object.entries(etM).forEach(([e, v]) => {
    const avgStd = v.stdCnt ? Math.round(v.stdSum / v.stdCnt) : '—';
    const avgPlan = v.planCnt ? Math.round(v.planSum / v.planCnt) : '—';
    html += `<tr><td>${e}</td><td>${v.cnt}</td><td>${avgStd}d</td><td>${avgPlan}d</td></tr>`;
  });
  
  html += '</table>';
  return html;
}

// ANÁLISIS 5: DETALLE
function buildDetalle(df){
  const ep = enrichPlazos(df);
  
  let html = '<h3>📋 Listado Completo</h3><table><tr style="background: var(--panel);"><th>Proyecto</th><th>Etapa</th><th>Ítem</th><th>Estándar</th><th>Plan Dur</th></tr>';
  
  ep.slice(0, 50).forEach(r => {
    html += `<tr><td>${r.Proyecto || '—'}</td><td>${r.Etapa || '—'}</td><td>${r.Ítem || '—'}</td><td>${r._stdDias || '—'}d</td><td>${r._durPlan || '—'}d</td></tr>`;
  });
  
  html += `</table><p>${ep.length} ítems total</p>`;
  return html;
}

// INIT
function initApp(data){
  DF = data;
  
  // Llenar dropdown de etapas
  const etapas = [...new Set(data.map(r => r.Etapa || 'Sin Etapa').filter(x => x))];
  const sel = document.getElementById('filterEtapa');
  etapas.forEach(e => {
    const opt = document.createElement('option');
    opt.value = e;
    opt.textContent = e;
    sel.appendChild(opt);
  });
  
  // Crear pestañas
  const tabsEl = document.getElementById('tabs');
  const secsEl = document.getElementById('sections');
  
  SECS.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (i === 0 ? ' active' : '');
    btn.textContent = s.label;
    btn.onclick = () => switchTab(s.id);
    tabsEl.appendChild(btn);
    
    const div = document.createElement('div');
    div.className = 'section' + (i === 0 ? ' active' : '');
    div.id = 'sec-' + s.id;
    if(i === 0) div.innerHTML = s.fn(DF);
    secsEl.appendChild(div);
  });
  
  document.getElementById('fcount').textContent = `${data.length} / ${data.length}`;
}

function switchTab(id){
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  
  const btn = document.querySelector(`.tab[onclick*="${id}"]`) || document.querySelector('.tab');
  const sec = document.getElementById('sec-' + id);
  
  if(btn) btn.classList.add('active');
  if(sec) {
    sec.classList.add('active');
    const sConfig = SECS.find(s => s.id === id);
    if(sConfig) {
      const proyecto = document.getElementById('filterProyecto').value.toLowerCase().trim();
      const etapa = document.getElementById('filterEtapa').value;
      
      let filtered = DF;
      if(proyecto) filtered = filtered.filter(r => (r.Proyecto || '').toLowerCase().includes(proyecto));
      if(etapa) filtered = filtered.filter(r => (r.Etapa || 'Sin Etapa') === etapa);
      
      sec.innerHTML = sConfig.fn(filtered);
    }
  }
}

// Conectar con API Monday
async function connectMonday(){
  const apikey = prompt('Pega tu API key de Monday.com:');
  if(!apikey) return;
  
  try {
    const response = await fetch('http://localhost:3000/api/monday', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        apiKey: apikey,
        query: `{boards(limit:100){id name items(limit:500){id name column_values{id text}}}}`
      })
    });
    
    const result = await response.json();
    if(result.errors) {alert('Error: ' + result.errors[0]?.message); return;}
    
    let items = [];
    result.data.boards.forEach(b => {
      (b.items || []).forEach(i => {
        const vals = {};
        i.column_values.forEach(cv => vals[cv.id] = cv.text);
        
        // Mapear columnas dinámicamente
        items.push({
          Proyecto: vals.proyecto || vals.project || b.name,
          Etapa: vals.etapa || vals.stage || 'Sin Etapa',
          Ítem: vals.item || i.name,
          'Nombre Genérico': vals.nombre || '',
          'Plazo Estándard': vals.plazo_std || vals.plazo || '',
          Planificado: vals.planificado || vals.plan || '',
          ...vals
        });
      });
    });
    
    if(items.length === 0) {alert('No se cargaron ítems'); return;}
    
    initApp(items);
  } catch(e) {
    alert('Error: ' + e.message + '\\n\\nVerifica que el proxy esté corriendo:\\nnode monday_proxy_server.js');
  }
}

// Botón para conectar
window.onload = () => {
  const btn = document.createElement('button');
  btn.textContent = 'Conectar con Monday.com';
  btn.onclick = connectMonday;
  btn.style.cssText = 'position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 1rem 2rem; background: var(--accent); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; z-index: 9999;';
  document.body.appendChild(btn);
};
</script>

</body>
</html>
